[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wqf7023-medical-rag"
version = "0.9.0"
description = "Multimodal similar-case RAG for new-case chest-radiography question answering"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Zhang Yue" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "Pillow>=10,<13",
  "scikit-learn>=1.6,<2",
  "streamlit>=1.42,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
models = [
  "accelerate>=0.33,<2",
  "bitsandbytes>=0.46,<1",
  "f1chexbert==0.0.2",
  "radgraph==0.1.18",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=5,<6",
  "sentencepiece>=0.2,<1",
  "torch>=2.3",
  "transformers>=4.45,<5",
  "open_clip_torch>=2.23,<4",
  "peft>=0.20,<1",
  "qwen-vl-utils>=0.0.8,<1",
  "hi-ml-multimodal==0.2.2",
]
documents = ["python-docx>=1.1,<2"]
test = [
  "pytest>=8,<10",
  "torch>=2.3",
]
all = [
  "accelerate>=0.33,<2",
  "bitsandbytes>=0.46,<1",
  "f1chexbert==0.0.2",
  "python-docx>=1.1,<2",
  "pytest>=8,<10",
  "radgraph==0.1.18",
  "sentence-transformers>=5,<6",
  "sentencepiece>=0.2,<1",
  "torch>=2.3",
  "transformers>=4.45,<5",
  "open_clip_torch>=2.23,<4",
  "peft>=0.20,<1",
  "qwen-vl-utils>=0.0.8,<1",
  "hi-ml-multimodal==0.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
